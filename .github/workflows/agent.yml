name: agent

on:
  push:
    branches: [main]
    paths:
      - "services/node-agent/**"
      - ".github/workflows/agent.yml"
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPO: node-agent

jobs:
  test-build-push:
    # Self-hosted runner fleet in vpc-mgmt (instance-profile AWS creds). See
    # infra/terraform/environments/dev/ci. No deploy step: the node agent
    # runs on SELLER hosts, not in our EKS cluster.
    runs-on: [self-hosted, linux, dev]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Test
        working-directory: services/node-agent
        run: |
          go vet ./...
          go test ./...

      - name: Resolve values
        id: vars
        run: |
          echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          # Registry: GHCR by default (cheap path). Set vars.REGISTRY to an ECR
          # host when running on AWS.
          echo "registry=${{ vars.REGISTRY }}" >> "$GITHUB_OUTPUT"
          if [ -z "${{ vars.REGISTRY }}" ]; then
            echo "registry=ghcr.io/${{ github.repository_owner }}" >> "$GITHUB_OUTPUT"
          fi

      - name: GHCR login
        if: startsWith(steps.vars.outputs.registry, 'ghcr.io')
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: ECR login
        if: startsWith(steps.vars.outputs.registry, 'ghcr.io') == false
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} \
            | docker login --username AWS --password-stdin ${{ steps.vars.outputs.registry }}

      - name: Set up buildx
        # Multi-arch (sellers run amd64 and arm64 GPU hosts).
        run: docker buildx create --use --name node-agent-builder || docker buildx use node-agent-builder

      - name: Build + push image
        # ECR repos are IMMUTABLE: tags are git-sha, never overwritten.
        working-directory: services/node-agent
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -t ${{ steps.vars.outputs.registry }}/${{ env.ECR_REPO }}:${{ steps.vars.outputs.sha_short }} \
            --push \
            .
