name: fix-gateway

on:
  push:
    paths:
      - "services/fix-gateway/**"
      - ".github/workflows/fix-gateway.yml"
  pull_request:
    paths:
      - "services/fix-gateway/**"
      - ".github/workflows/fix-gateway.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Build + test
        working-directory: services/fix-gateway
        run: |
          cargo build --all-targets
          cargo test
