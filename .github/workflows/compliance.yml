name: compliance

on:
  push:
    paths:
      - "services/compliance/**"
      - ".github/workflows/compliance.yml"
  pull_request:
    paths:
      - "services/compliance/**"
      - ".github/workflows/compliance.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Vet + test
        working-directory: services/compliance
        run: |
          go vet ./...
          go test ./...
