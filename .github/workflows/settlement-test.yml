name: settlement-test

on:
  push:
    paths:
      - "services/settlement/**"
      - ".github/workflows/settlement-test.yml"
  pull_request:
    paths:
      - "services/settlement/**"
      - ".github/workflows/settlement-test.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Vet + test
        working-directory: services/settlement
        run: |
          go vet ./...
          go test ./...
