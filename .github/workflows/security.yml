name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # weekly, Monday 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  secrets:
    name: gitleaks (secret scan, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  go-vuln:
    name: govulncheck (${{ matrix.svc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        svc: [api, catalog, settlement, compliance, node-agent]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: "stable" }
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...
        working-directory: services/${{ matrix.svc }}

  rust-audit:
    name: cargo audit (${{ matrix.svc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        svc: [fix-gateway, telemetry-verifier, market-data, matching-engine]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      # RUSTSEC-2023-0071: `rsa` (Marvin timing side-channel) reaches us only via
      # sqlx-mysql, which is compiled but never used (Postgres only); no fix exists.
      - run: cargo audit --ignore RUSTSEC-2023-0071
        working-directory: services/${{ matrix.svc }}

  web-audit:
    name: npm audit (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci
        working-directory: frontend/web
      - run: npm audit --audit-level=high
        working-directory: frontend/web

  python-audit:
    name: pip-audit (index-engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pip-audit && pip-audit -r services/index-engine/requirements.txt
