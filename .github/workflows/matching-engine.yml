name: matching-engine

on:
  push:
    paths:
      - "services/matching-engine/**"
      - ".github/workflows/matching-engine.yml"
  pull_request:
    paths:
      - "services/matching-engine/**"
      - ".github/workflows/matching-engine.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: System deps (librdkafka cmake build + openssl)
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential libssl-dev pkg-config
      - name: Build + test
        working-directory: services/matching-engine
        run: |
          cargo build --all-targets
          cargo test
