# Compute Trading Exchange — Render blueprint (DRAFT, not yet deployed).
#
# Everything runs on the smallest plans (cheap-path rule — these are starting
# points; bump per service when load appears). All services MUST land in one
# region: private networking (KAFKA_BROKERS, REDIS_URL, pserv addresses) is
# region-local. Kafka runs as a private redpanda service because Render has
# no managed Kafka; its private DNS name is the service name (`redpanda`),
# so KAFKA_BROKERS is a fixed value here, and --advertise-kafka-addr below
# must match it.
#
# Env conventions mirror infra/dev-stack/.env.example and the e2e scripts:
#   DATABASE_URL (fromDatabase), REDIS_URL (fromService), KAFKA_BROKERS,
#   KAFKA_TLS_ENABLED=false (plaintext on the private network; mTLS is the
#   AWS/MSK path, see docs/ARCHITECTURE.md).

services:
  # ---------------------------------------------------------------------
  # Web services (HTTP)
  # ---------------------------------------------------------------------

  - type: web
    name: cte-catalog
    runtime: go
    plan: starter
    buildCommand: mkdir -p bin && cd services/catalog && go build -o ../../bin/catalog .
    startCommand: ./bin/catalog
    healthCheckPath: /healthz
    # Migrations run here (idempotent) before every catalog deploy — the
    # cheapest stand-in for a one-off job. Pure-Go runner (scripts/migrate):
    # Render's native Go runtime denies root, so no apt/psql anywhere.
    # Manual fallback in docs/RENDER.md.
    preDeployCommand: cd scripts/migrate && go run .
    envVars:
      - key: GO_VERSION
        value: "1.22"
      - key: PORT
        value: "8080"
      - key: LISTEN_ADDR
        value: ":8080"
      - key: DATABASE_URL
        fromDatabase:
          name: cte-postgres
          property: connectionString

  - type: web
    name: cte-order
    runtime: docker # NOT go: the risk/v1 gRPC stubs are gitignored and
                    # generated at image build by services/order/Dockerfile
                    # (needs protoc; Render's native Go runtime has neither
                    # protoc nor apt). Repo-root build context required.
    dockerfilePath: services/order/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: "8090"
      - key: LISTEN_ADDR
        value: ":8090"      # public REST
      - key: GRPC_ADDR
        value: ":9090"      # gRPC front — private-network only on Render
      - key: DATABASE_URL
        fromDatabase:
          name: cte-postgres
          property: connectionString
      - key: KAFKA_BROKERS
        value: redpanda-u6mq:9092
      - key: KAFKA_TLS_ENABLED
        value: "false"
      # M1: reject REST calls that did not come through the API gateway. Must
      # match cte-api's GATEWAY_SHARED_SECRET. (gRPC front stays private-network.)
      - key: GATEWAY_SHARED_SECRET
        sync: false
      - key: RISK_ADDR
        value: cte-risk:9094 # gRPC pre-trade check (private network)

  - type: web
    name: cte-settlement
    runtime: go
    plan: starter
    buildCommand: mkdir -p bin && cd services/settlement && go build -o ../../bin/settlement .
    startCommand: ./bin/settlement
    healthCheckPath: /healthz
    envVars:
      - key: GO_VERSION
        value: "1.22"
      - key: PORT
        value: "8083"
      - key: LISTEN_ADDR
        value: ":8083"
      - key: DATABASE_URL
        fromDatabase:
          name: cte-postgres
          property: connectionString
      - key: KAFKA_BROKERS
        value: redpanda-u6mq:9092
      - key: KAFKA_TLS_ENABLED
        value: "false"
      # M1: reject escrow REST calls that did not come through the API gateway.
      # Must match cte-api's GATEWAY_SHARED_SECRET.
      - key: GATEWAY_SHARED_SECRET
        sync: false
      # M3: Stripe card deposits. Set both in the dashboard (never in git).
      # Webhook endpoint to register in Stripe:
      #   https://cte-settlement.onrender.com/v1/stripe/webhook
      #   events: checkout.session.completed, checkout.session.expired,
      #           checkout.session.async_payment_succeeded,
      #           checkout.session.async_payment_failed
      # Unset => card deposits disabled (admin credit still works).
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Where Stripe Checkout sends the user back (success/cancel).
      - key: PUBLIC_WEB_URL
        value: https://exchange.hqube.co

  # Risk: positions from `trades`, pre-trade checks for order (gRPC :9094),
  # GET /v1/positions for the gateway (REST :8084). Private: no public URL.
  - type: pserv
    name: cte-risk
    runtime: docker # risk/v1 gRPC stubs generated at image build (see cte-order)
    dockerfilePath: services/risk/Dockerfile
    dockerContext: .
    plan: starter
    envVars:
      - key: LISTEN_ADDR
        value: ":8084"
      - key: GRPC_ADDR
        value: ":9094"
      - key: DATABASE_URL
        fromDatabase:
          name: cte-postgres
          property: connectionString
      - key: KAFKA_BROKERS
        value: redpanda-u6mq:9092
      - key: KAFKA_TLS_ENABLED
        value: "false"
      - key: GATEWAY_SHARED_SECRET
        sync: false

  # Compliance: market surveillance (wash trades, spoofing) from trades +
  # order-updates; admin review API through the gateway. Private.
  - type: pserv
    name: cte-compliance
    runtime: go
    buildCommand: mkdir -p bin && cd services/compliance && go build -o ../../bin/compliance .
    startCommand: ./bin/compliance
    plan: starter
    envVars:
      - key: GO_VERSION
        value: "1.22"
      - key: LISTEN_ADDR
        value: ":8085"
      - key: DATABASE_URL
        fromDatabase:
          name: cte-postgres
          property: connectionString
      - key: KAFKA_BROKERS
        value: redpanda-u6mq:9092
      - key: KAFKA_TLS_ENABLED
        value: "false"
      - key: GATEWAY_SHARED_SECRET
        sync: false

  - type: web
    name: cte-api
    runtime: go
    plan: starter
    buildCommand: mkdir -p bin && cd services/api && go build -o ../../bin/api .
    startCommand: ./bin/api
    healthCheckPath: /healthz
    # API_TLS_ENABLED=false: plain HTTP behind Render's TLS-terminating proxy
    # (the service's default is self-signed HTTPS for the AWS ALB path).
    envVars:
      - key: GO_VERSION
        value: "1.22"
      - key: PORT
        value: "8443"
      - key: LISTEN_ADDR
        value: ":8443"
      - key: API_TLS_ENABLED
        value: "false"
      - key: APP_VERSION
        value: render
      # Shared secret for POST /v1/admin/offload (X-Admin-Token header).
      - key: ADMIN_TOKEN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: cte-postgres
          property: connectionString
      # S3 offloader placeholders — leave S3_BUCKET empty to keep it disabled.
      - key: S3_BUCKET
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      # --- M1 auth gateway ---
      # Supabase (dedicated project "stealth-project-auth"). The project signs
      # access tokens with ES256; the gateway verifies against the public JWKS
      # at SUPABASE_URL/auth/v1/.well-known/jwks.json — no shared secret needed.
      # SUPABASE_ANON_KEY is sent as the `apikey` header when fetching the JWKS.
      # NOTE: Render env is NOT auto-synced from this file — set every sync:false
      # secret by hand in the dashboard (this repo learned that the hard way).
      - key: SUPABASE_URL
        value: https://diviltkcrvxshvfchufd.supabase.co
      - key: SUPABASE_ANON_KEY
        sync: false
      # Optional legacy HS256 secret; leave unset for ES256/JWKS (the default).
      - key: SUPABASE_JWT_SECRET
        sync: false
      # Stamped on internal calls (X-Gateway-Secret); downstreams reject calls
      # without it. Must match GATEWAY_SHARED_SECRET on cte-order/cte-settlement.
      - key: GATEWAY_SHARED_SECRET
        sync: false
      # Downstream fan-out targets on Render's private network.
      - key: ORDER_ADDR
        value: http://cte-order:8090
      - key: SETTLEMENT_ADDR
        value: http://cte-settlement:8083
      - key: CATALOG_ADDR
        value: http://cte-catalog:8080
      - key: MARKETDATA_ADDR
        value: http://cte-market-data:8081
      - key: RISK_ADDR
        value: http://cte-risk:8084
      - key: COMPLIANCE_ADDR
        value: http://cte-compliance:8085
      # Per-account rate limit (token bucket).
      - key: RATE_LIMIT_RPS
        value: "20"
      - key: RATE_LIMIT_BURST
        value: "40"

  # ---------------------------------------------------------------------
  # Web UI (M2) — Next.js, Node runtime. Talks to cte-api through a same-
  # origin rewrite (/api/gw/* -> GATEWAY_URL) so the gateway needs no CORS,
  # and to cte-market-data directly over WebSocket (public quotes).
  # ---------------------------------------------------------------------

  - type: web
    name: cte-web
    runtime: node
    plan: starter
    rootDir: frontend/web
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /login
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      # Server-side proxy target. Public URL: the browser never sees it, but
      # the Next server runs on the private network too, so either works.
      - key: GATEWAY_URL
        value: https://cte-api-esnd.onrender.com
      - key: NEXT_PUBLIC_SUPABASE_URL
        value: https://diviltkcrvxshvfchufd.supabase.co
      # Public anon key (safe in the browser; RLS enforces access).
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: NEXT_PUBLIC_MARKETDATA_WS_URL
        value: wss://cte-market-data.onrender.com

  - type: web
    name: cte-market-data
    runtime: docker # Rust service: build from the repo Dockerfile
    dockerfilePath: services/market-data/Dockerfile
    dockerContext: services/market-data
    plan: starter
    # WebSocket fan-out (Render web services support WS). The code has no
    # health route — Render falls back to a TCP port check.
    envVars:
      - key: PORT
        value: "8081"
      - key: LISTEN_ADDR
        value: ":8081"
      - key: KAFKA_BROKERS
        value: redpanda-u6mq:9092
      - key: KAFKA_TLS_ENABLED
        value: "false"
      - key: RUST_LOG
        value: info

  # ---------------------------------------------------------------------
  # Background workers (no public ingress)
  # ---------------------------------------------------------------------

  - type: worker
    name: cte-matching-engine
    runtime: docker
    dockerfilePath: services/matching-engine/Dockerfile
    dockerContext: services/matching-engine
    plan: starter
    numInstances: 1 # SINGLE-WRITER: the book lives in process memory and
                    # matching must be strictly sequential per symbol
                    # (services/matching-engine/README.md). Never scale >1
                    # without symbol sharding.
    envVars:
      - key: KAFKA_BROKERS
        value: redpanda-u6mq:9092
      - key: KAFKA_TLS_ENABLED
        value: "false"
      - key: REDIS_URL
        fromService:
          type: redis
          name: cte-redis
          property: connectionString
      - key: RUST_LOG
        value: info

  - type: web
    name: cte-telemetry-verifier
    runtime: docker
    dockerfilePath: services/telemetry-verifier/Dockerfile
    dockerContext: services/telemetry-verifier
    plan: starter
    healthCheckPath: /healthz
    # Public so seller node-agents can register/heartbeat (:8082). Was a
    # worker (no ingress) until the first seller node (cte-node-agent below).
    # Registration is gated by REGISTRATION_TOKEN; heartbeats are Ed25519-signed.
    envVars:
      - key: PORT
        value: "8082"
      - key: LISTEN_ADDR
        value: ":8082"
      - key: DATABASE_URL
        fromDatabase:
          name: cte-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: cte-redis
          property: connectionString
      - key: KAFKA_BROKERS
        value: redpanda-u6mq:9092
      - key: KAFKA_TLS_ENABLED
        value: "false"
      - key: REGISTRATION_TOKEN
        sync: false # set in the Render dashboard — never commit a value
      - key: RUST_LOG
        value: info

  # Demo seller node (closed beta): a fake-GPU H100 node-agent with the mock
  # executor, so H100 trades find capacity and SETTLE instead of failing
  # NO_CAPACITY. Registers itself against the verifier on boot (ephemeral
  # disk => one fresh seller_nodes row per deploy; settlement picks the
  # newest active node). Real sellers run this binary on their own hardware
  # (docs/RENDER.md). Remove when a real H100 seller is onboarded.
  - type: worker
    name: cte-node-agent
    runtime: docker
    dockerfilePath: services/node-agent/Dockerfile
    dockerContext: services/node-agent
    plan: starter
    numInstances: 1
    envVars:
      - key: MODE
        value: prometheus # no telemetry edge on Render; metrics stay local
      - key: AGENT_FAKE_GPU
        value: "1" # collector reports FakeGPU-H100 -> gpu_types H100
      - key: EXECUTOR_MODE
        value: mock
      - key: KEY_PATH
        value: /tmp/exchange-agent/key.pem # distroless nonroot: /etc is read-only
      - key: STATE_PATH
        value: /tmp/exchange-agent/state.json
      - key: VERIFIER_URL
        value: https://cte-telemetry-verifier-w3t7.onrender.com
      - key: JOBS_URL
        value: https://cte-settlement.onrender.com
      # Account (UUID) that owns the demo node; must match cte-telemetry-verifier's token.
      - key: SELLER_ID
        sync: false
      - key: REGISTRATION_TOKEN
        sync: false

  - type: worker
    name: cte-index-engine
    runtime: python
    plan: starter
    buildCommand: cd services/index-engine && pip install -r requirements.txt
    startCommand: cd services/index-engine && python -m index_engine.main
    numInstances: 1 # singleton consumer: replicas would each see only a
                    # partition subset and emit partial indices (k8s note)
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6" # matches Dockerfile base (3.12-slim); kafka-python 2.3.2
      - key: KAFKA_BROKERS
        value: redpanda-u6mq:9092
      - key: KAFKA_TLS_ENABLED
        value: "false"
      - key: REDIS_URL
        fromService:
          type: redis
          name: cte-redis
          property: connectionString
      - key: TRADES_TOPIC
        value: trades
      - key: INDEX_TOPIC
        value: market-data
      - key: WINDOW_SECONDS
        value: "600"
      - key: PUBLISH_INTERVAL_SECONDS
        value: "15"

  # ---------------------------------------------------------------------
  # Private services (internal network only)
  # ---------------------------------------------------------------------

  - type: pserv
    name: fix-gateway
    runtime: docker
    dockerfilePath: services/fix-gateway/Dockerfile
    dockerContext: services/fix-gateway
    plan: starter
    # FIX 4.4 over TCP, reachable at fix-gateway:9878 from other services in
    # the region. No public ingress (external FIX sessions are a later,
    # deliberate step — see docs/RENDER.md).
    envVars:
      - key: FIX_LISTEN_ADDR
        value: "0.0.0.0:9878"
      - key: FIX_SENDER_COMP_ID
        value: CTE
      # Batch 3b: orders go to cte-order's REST front with the gateway trust
      # headers; the FIX logon (CompID + Password 554) maps to an account.
      - key: ORDER_ADDR
        value: http://cte-order:8090
      - key: CATALOG_ADDR
        value: http://cte-catalog:8080
      - key: FIX_POLL_SECS
        value: "2"
      - key: GATEWAY_SHARED_SECRET
        sync: false
      - key: FIX_CLIENTS
        sync: false # "COMPID:password:account-uuid;..." — one entry per institutional client

  # Kafka stand-in: Render has no managed Kafka. Single-node redpanda with a
  # persistent disk, plaintext on the private network only. RAM-hungry even
  # trimmed down — bump the plan first if anything OOMs.
  - type: pserv
    name: redpanda
    runtime: image
    image:
      # Docker Hub — Render could not fetch from docker.redpanda.com.
      # Pinned (not latest) for reproducible deploys; v26.2.2 exists on
      # docker.io (verified 2026-08-31).
      url: docker.io/redpandadata/redpanda:v26.2.2
    plan: starter
    # Flags as in infra/dev-stack/docker-compose.yml, memory trimmed for the
    # starter plan, advertised address = this service's private DNS name.
    #
    # Launch via the image's own /entrypoint.sh (proven, live). Topics are
    # created manually once after first boot (Render Shell → the rpk command
    # below); scripted attempts (bootstrap.yaml via sh/bash wrappers) failed
    # repeatedly on Render's command parsing — keep it simple and working.
    dockerCommand: /entrypoint.sh redpanda start --smp=1 --memory=400M
      --reserve-memory=0M --overprovisioned --check=false
      --kafka-addr=PLAINTEXT://0.0.0.0:9092
      --advertise-kafka-addr=PLAINTEXT://redpanda-u6mq:9092
    # Manual topic creation (one time): Render dashboard → redpanda → Shell:
    # rpk topic create orders trades order-updates node-telemetry \
    #   node-health-events sla-breach-events market-data --brokers localhost:9092
    # initialDeployHook only fires on a service's FIRST deploy; ours predated
    # the working config, so keep this as documentation, not mechanism.
    initialDeployHook: /usr/bin/rpk topic create orders trades order-updates
      node-telemetry node-health-events sla-breach-events market-data
      --brokers localhost:9092
    disk:
      name: redpanda-data
      mountPath: /var/lib/redpanda/data
      sizeGB: 10

  # ---------------------------------------------------------------------
  # Infra
  # ---------------------------------------------------------------------

  - type: redis
    name: cte-redis
    plan: starter
    ipAllowList: [] # private network only
    maxmemoryPolicy: noeviction # matching-engine snapshots + SLA windows + index points must not be evicted

databases:
  - name: cte-postgres
    plan: basic-256mb # smallest managed Postgres; free tier exists for trials
    databaseName: exchange
    user: exchange
