apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: settlement
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/hankerino/stealth-project
    targetRevision: main
    path: services/settlement/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: exchange
  syncPolicy:
    automated: { prune: true, selfHeal: true }
