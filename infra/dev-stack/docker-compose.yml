# Cheap dev stack for the Compute Trading Exchange — NO AWS required.
# postgres 16 + redis 7 + redpanda (Kafka-compatible).
# Start with: scripts/dev-up.sh   (see docs/ALTERNATIVE_STACK.md)

name: cte-dev

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: exchange
      POSTGRES_USER: exchange
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-only-change-me}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../../services/catalog/db/migrations:/migrations/catalog:ro
      - ../../services/order/db/migrations:/migrations/order:ro
      - ../../services/settlement/db/migrations:/migrations/settlement:ro
      - ./init/apply-migrations.sh:/docker-entrypoint-initdb.d/90-apply-migrations.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exchange -d exchange"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Redpanda: single-binary, Kafka-API-compatible. No ZooKeeper, no JVM.
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      # Services run on the host in the cheap dev path, so the advertised
      # address must resolve from the host, not from inside the container net.
      - --advertise-kafka-addr=PLAINTEXT://localhost:9092
    ports:
      - "9092:9092"
      - "9644:9644"   # admin API
    healthcheck:
      # rpk ships in the image; curl does not.
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  pgdata:
  redisdata:
