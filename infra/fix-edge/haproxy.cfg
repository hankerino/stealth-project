# haproxy on the relay VPS: TLS-terminate FIX on :9878, forward raw TCP over
# the WireGuard tunnel to the Render jump container (10.77.0.2:9878), which
# socat-forwards to fix-gateway:9878 on Render's private network.
global
    log /dev/log local0
    maxconn 512
    ssl-default-bind-options ssl-min-ver TLSv1.2

defaults
    mode tcp
    log global
    option tcplog
    timeout connect 5s
    timeout client  120s   # > FIX HeartBtInt (30s) with margin
    timeout server  120s

frontend fix_in
    bind *:9878 ssl crt /etc/haproxy/certs/fix.pem   # fullchain+key, e.g. from certbot
    default_backend fix_gw

backend fix_gw
    server render_jump 10.77.0.2:9878 check inter 10s
