mode: daemonset

image:
  repository: otel/opentelemetry-collector-contrib

presets:
  logsCollection:
    enabled: true

config:
  exporters:
    prometheus:
      endpoint: "0.0.0.0:8889"
    loki:
      endpoint: ${loki_push_url}

  service:
    pipelines:
      metrics:
        exporters: [prometheus]
      logs:
        exporters: [loki]

# Prometheus scrapes the collector's :8889 exporter.
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8889"
