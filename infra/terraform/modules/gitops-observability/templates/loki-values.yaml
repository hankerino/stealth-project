# Single-binary Loki for dev. Filesystem storage (no S3 backend wired yet).
deploymentMode: SingleBinary

loki:
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem

singleBinary:
  replicas: 1

# Nothing else in dev: no gateway HA, no memberlist scale-out.
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0
