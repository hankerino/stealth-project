apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: default
spec:
  template:
    metadata: {}
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      # startupTaints prevent pods from scheduling on a node until Cilium CNI
      # is fully initialized. Cilium removes the taint via its node-init
      # DaemonSet once the eBPF filesystem is mounted and the CNI config is
      # written. Without this, pods land in ContainerCreating on fresh nodes
      # because kubelet can't assign IP addresses before Cilium is ready.
      startupTaints:
        - key: node.cilium.io/agent-not-ready
          value: "true"
          effect: NoSchedule
      requirements:
        - key: karpenter.k8s.aws/instance-family
          operator: In
          values:
%{ for f in families ~}
            - ${f}
%{ endfor ~}
        - key: karpenter.sh/capacity-type
          operator: In
          values:
            - spot
        - key: kubernetes.io/arch
          operator: In
          values:
            - amd64
        - key: kubernetes.io/os
          operator: In
          values:
            - linux
  limits:
    cpu: "1000"
    memory: 4000Gi
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 60s
