apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: market-data
  namespace: exchange
  labels:
    app: market-data
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: market-data
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
