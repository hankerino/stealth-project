[package]
name = "market-data"
version = "0.1.0"
edition = "2021"
description = "Market-data fan-out service: Kafka trades/order-updates -> in-memory per-symbol state -> websocket quotes/trades channels"

[dependencies]
tokio = { version = "1", features = ["full"] }
rdkafka = { version = "0.36", features = ["cmake-build", "ssl"] }
# Pin rdkafka-sys: >=4.8 bundles librdkafka >=2.5 whose cmake build writes
# `#define WITH_* 0` into the generated config.h while sources test `#ifdef`
# — so the build then wrongly pulls in <curl/curl.h> and fails without system
# curl headers. 4.7.0 (librdkafka 2.3.0) defines flags only when enabled.
rdkafka-sys = "=4.10.0" # bundles librdkafka 2.3.0
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-tungstenite = "0.30"
futures = "0.3"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = true
codegen-units = 1
