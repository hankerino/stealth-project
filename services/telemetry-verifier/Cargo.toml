[package]
name = "telemetry-verifier"
version = "0.1.0"
edition = "2021"
description = "In-cluster SLA engine: verifies signed node telemetry, tracks health/SLA sliding windows in Redis, emits NodeHealthEvent/SlaBreach, hourly Aurora aggregates"

[dependencies]
tokio = { version = "1", features = ["full"] }
rdkafka = { version = "0.36", features = ["cmake-build", "ssl"] }
# Pin rdkafka-sys: >=4.8 bundles librdkafka >=2.5 whose cmake build writes
# `#define WITH_* 0` into the generated config.h while sources test `#ifdef`
# — so the build then wrongly pulls in <curl/curl.h> and fails without system
# curl headers. 4.7.0 (librdkafka 2.3.0) defines flags only when enabled.
rdkafka-sys = "=4.7.0" # bundles librdkafka 2.3.0
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.10"
base64 = "0.22"
redis = { version = "0.27", features = ["tokio-comp"] }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "chrono",
    "uuid",
] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
axum = "0.8"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
rand = "0.8"

[profile.release]
lto = true
codegen-units = 1
