apiVersion: v1
kind: Service
metadata:
  name: telemetry-verifier
  namespace: exchange
  labels:
    app: telemetry-verifier
spec:
  # In-cluster only: node agents reach registration/heartbeat via the internal
  # ingress; nothing here is edge-exposed.
  type: ClusterIP
  selector:
    app: telemetry-verifier
  ports:
    - name: http
      port: 8082
      targetPort: http
