[package]
name = "matching-engine"
version = "0.1.0"
edition = "2021"
description = "Compute Trading Exchange — in-memory limit order book matching engine (Phase 1A)"

[dependencies]
tokio = { version = "1", features = ["full"] }
# default-features = false keeps out sasl/gssapi/zstd/curl extras; cmake-build
# builds the bundled librdkafka statically (no system librdkafka needed), ssl
# keeps KAFKA_TLS_ENABLED support.
rdkafka = { version = "0.36", default-features = false, features = ["cmake-build", "ssl", "tokio"] }
# Pin rdkafka-sys: >=4.8 bundles librdkafka >=2.5 whose cmake build writes
# `#define WITH_* 0` into the generated config.h while sources test `#ifdef`
# — so the build then wrongly pulls in <curl/curl.h> and fails without system
# curl headers. 4.7.0 (librdkafka 2.3.0) defines flags only when enabled.
rdkafka-sys = "=4.10.0" # bundles librdkafka 2.3.0
redis = { version = "0.27", features = ["tokio-comp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
