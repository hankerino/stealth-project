# Order Service deployment.
#
# Config pattern: non-sensitive settings come from a ConfigMap named
# `order-config`, secrets (DATABASE_URL, and later the MSK TLS client
# certificate) from a Secret named `order-secrets`, e.g.:
#
#   kubectl -n exchange create configmap order-config \
#     --from-literal=LISTEN_ADDR=:8080 \
#     --from-literal=GRPC_ADDR=:9090 \
#     --from-literal=KAFKA_BROKERS=b-1.msk.amazonaws.com:9094,b-2.msk.amazonaws.com:9094 \
#     --from-literal=KAFKA_TLS_ENABLED=true
#   kubectl -n exchange create secret generic order-secrets \
#     --from-literal=DATABASE_URL='postgres://user:pass@aurora-endpoint:5432/exchange'
#
# NOTE: MSK TLS client-certificate provisioning is a follow-up; when it
# lands, mount the cert/key from `order-secrets` as a volume and point the
# producer's tls.Config at it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order
  namespace: exchange
  labels:
    app: order
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order
  template:
    metadata:
      labels:
        app: order
    spec:
      containers:
        - name: order
          image: exchange/order:dev
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 9090
          envFrom:
            - configMapRef:
                name: order-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: order-secrets
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
