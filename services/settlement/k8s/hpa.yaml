apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: settlement
  namespace: exchange
  labels:
    app: settlement
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: settlement
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
