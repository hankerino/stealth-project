[package]
name = "fix-gateway"
version = "0.1.0"
edition = "2021"
description = "Compute Trading Exchange — FIX 4.4 gateway (Phase 3)"

[lib]
name = "fix_gateway"
path = "src/lib.rs"

[[bin]]
name = "fix-gateway"
path = "src/main.rs"

# Batch 3a is std only: the FIX codec + session + a threaded TCP server.
# Batch 3b bridges sessions to the order service over its private-network
# REST (blocking ureq, no TLS needed) and polls order state for
# ExecutionReports — deliberately no gRPC/Kafka so the image stays small.
[dependencies]
ureq = { version = "2.10", default-features = false, features = ["json"] }
serde_json = "1"
